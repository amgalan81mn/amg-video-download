<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <title>Файлын нэр давхцлаа</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { width: auto; min-height: 100vh; }
    main { padding: 14px; display: flex; gap: 12px; }
    main img { width: 48px; height: 48px; flex: none; }
    .file { font-weight: 600; word-break: break-all; margin: 4px 0 8px; }
    .btns { display: flex; gap: 6px; padding: 0 14px 14px; }
    .btns button { flex: 1; }
  </style>
</head>
<body class="window">
  <main>
    <img src="icons/video128.png" alt="">
    <div>
      <div>Ийм нэртэй файл аль хэдийн байна:</div>
      <div class="file" id="file"></div>
      <div class="small">Юу хийх вэ?</div>
    </div>
  </main>
  <div class="btns">
    <button class="primary" data-a="rename">Шинэ нэрээр хадгалах</button>
    <button data-a="overwrite">Дарж бичих</button>
    <button data-a="cancel">Цуцлах</button>
  </div>
  <script src="confirm.js"></script>
</body>
</html>
