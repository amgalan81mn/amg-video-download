<!DOCTYPE html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <title>Amg-Video-Download — тоглуулагч</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #e5e7eb; font: 13px system-ui, sans-serif; overflow: hidden; }
    video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }
    #msg {
      position: absolute; left: 50%; top: 12px; transform: translateX(-50%); padding: 6px 12px; border-radius: 6px;
      background: rgba(0, 0, 0, .75); cursor: pointer; display: none; white-space: nowrap;
    }
    #msg.show { display: block; }
    #msg.err { background: #b91c1c; cursor: default; }
  </style>
</head>
<body>
  <video id="v" controls playsinline></video>
  <audio id="a"></audio>
  <div id="msg"></div>
  <script src="player.js"></script>
</body>
</html>
